name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # `mypy .` aborta: o launcher __init__.py na raiz + nome de diretório com hífen
      # fazem o mypy tentar tratar a raiz como pacote. Usa-se o fallback previsto no
      # plano (fase0-detalhado, verificação passo 4): checar src e tests explicitamente.
      - run: mypy src tests
      - run: pytest
