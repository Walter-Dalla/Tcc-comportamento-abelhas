# Backend GPU do Rectify (Fase 5). Mesma interface do cpu-perspective-rectifier.
# Requer um build de OpenCV com CUDA + módulo contrib `cudawarping`/`cudaimgproc`
# (o pacote PyPI opencv-python/opencv-contrib-python NÃO traz CUDA). O manifest atual
# (Fase 2, PluginRequires com extra="forbid") não tem campo para expressar
# "precisa de build com CUDA" — essa exigência está documentada em
# docs/handoffs/fase5-backends-gpu-handoff.md (débito: campo requires.capabilities).
[plugin]
name        = "cuda-perspective-rectifier"
version     = "1.0.0"
kind        = "rectify"
entry       = "plugin:CudaPerspectiveRectifier"
api_version = "1.0"
schema      = ">=1.0,<2.0"

[requires]
python   = ">=3.11"
packages = ["opencv-contrib-python>=4.9", "numpy>=1.26"]
plugins  = []

[ordering]
before = []
after  = []
priority = 100
