# Backend GPU do Detect (Fase 5). MESMA interface Detector do
# background-subtraction-detector, mas algoritmo DIFERENTE: MOG2 (não máximo-estático).
# Requer OpenCV com CUDA + módulo contrib `cudabgsegm` (o PyPI não traz). Exigência de
# build CUDA documentada em docs/handoffs/fase5-backends-gpu-handoff.md (o manifest da
# Fase 2 não tem campo para expressá-la — débito: requires.capabilities).
[plugin]
name        = "cuda-mog2-detector"
version     = "1.0.0"
kind        = "detector"
entry       = "plugin:CudaMOG2Detector"
api_version = "1.0"
schema      = ">=1.0,<2.0"

[requires]
python   = ">=3.11"
packages = ["opencv-contrib-python>=4.9", "numpy>=1.26"]
plugins  = []

[ordering]
before = []
after  = []
priority = 100
